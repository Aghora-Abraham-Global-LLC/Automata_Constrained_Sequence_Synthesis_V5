name: Release & Zenodo Archival

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Package Release for Zenodo & GitHub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Type-Check Codebase
        run: npm run lint

      - name: Build Production Web Application
        run: npm run build

      - name: Package Distributable Archives
        run: |
          tar -czf automata-v5-dist.tar.gz -C dist .
          zip -r automata-v5-dist.zip dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            automata-v5-dist.tar.gz
            automata-v5-dist.zip
            CITATION.cff
            .zenodo.json
          draft: false
          prerelease: false
          generate_release_notes: true
          name: "Automata Constrained Sequence Synthesis ${{ github.ref_name }} (Zenodo Reference Release)"
          body: |
            ## Automated Reference Implementation Release ${{ github.ref_name }}

            This release provides the compiled distribution and metadata for **Automata Constrained Sequence Synthesis (Version 5.0)**:
            - **Paper Title**: *Phase-Synchronized Trajectory Optimization in Synthetic Multi-Agent Systems: Adaptive Extended Symplectic Control and Planar Braid Complexity*
            - **DOI**: [10.5281/zenodo.22851183](https://doi.org/10.5281/zenodo.22851183)
            - **Primary AMS**: 70H15, 65P10, 57K10, 37N05, 49M30
            - **Author**: Arya Arunachala Ananda Ghulam-e-Shah-e-Unmani (*BhutaDamaraSena R&D Labs, Aghora Abraham Global LLC*)

            Zenodo automatically archives this release and issues a permanent archival snapshot.
