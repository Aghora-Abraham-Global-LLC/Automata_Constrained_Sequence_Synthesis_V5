name: Release & Zenodo Archival

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  build-and-release:
    name: Package Release for Zenodo & GitHub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install Dependencies
        run: npm install

      - name: Type-Check Codebase
        run: npm run lint

      - name: Build Production Web Application
        run: npm run build

      - name: Package Distributable Archives
        run: |
          tar -czf automata-v5-dist.tar.gz -C dist .
          zip -r automata-v5-dist.zip dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            automata-v5-dist.tar.gz
            automata-v5-dist.zip
            CITATION.cff
            .zenodo.json
          draft: false
          prerelease: false
          generate_release_notes: true
          name: "Phase-Synchronized Trajectory Optimization ${{ github.ref_name }} (Zenodo Reference Release)"
          body: |
            ## Automated Reference Implementation Release ${{ github.ref_name }}

            This release provides the compiled distribution and metadata for **Phase-Synchronized Trajectory Optimization in Synthetic Multi-Agent Systems: Adaptive Extended Symplectic Control and Planar Braid Complexity (Version 5.0)**:
            - **Monograph Title**: *Phase-Synchronized Trajectory Optimization in Synthetic Multi-Agent Systems: Adaptive Extended Symplectic Control and Planar Braid Complexity*
            - **Permanent DOI**: [10.5281/zenodo.22851183](https://doi.org/10.5281/zenodo.22851183)
            - **Author**: Arya Arunachala Ananda Ghulam-e-Shah-e-Unmani
            - **Institution**: BhutaDamaraSena R&D Labs · Aghora Abraham Global LLC

            ### Contents
            - `automata-v5-dist.tar.gz`: Pre-compiled static SPA bundle ready for web hosting.
            - `automata-v5-dist.zip`: Zip-formatted distributable build.
            - `CITATION.cff`: Citation metadata format 1.2.0.
            - `.zenodo.json`: Zenodo automatic ingestion metadata.
